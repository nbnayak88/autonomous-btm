<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workbook · Continuous Process Assurance</title><link rel="icon" href="assets/favicon.png"><style>:root{--blk:#0b0b0b;--grn:#78b62e;--grn2:#92d337;--pink:#ed547c;--light:#eef6e3;--grey:#5b6770;--line:#d9e3cc;--ink:#1c2420;--bg:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
a{color:#3f7d10;text-decoration:none}a:hover{text-decoration:underline}
.top{position:sticky;top:0;z-index:50;background:var(--blk);color:#fff;display:flex;align-items:center;gap:16px;padding:6px 20px;border-bottom:3px solid var(--grn)}
.brand{display:flex;align-items:center;gap:12px;color:#fff}.brand:hover{text-decoration:none}.brand img{width:46px;height:46px;border-radius:6px}
.brand b{display:block;font-size:16px;line-height:1.1}.brand small{color:var(--grn2);font-size:12px}
.top nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}.top nav a{color:#dfe8d3;padding:8px 12px;border-radius:6px;font-size:14px}
.top nav a:hover{background:#1d2a14;text-decoration:none}.top nav a.on{background:var(--grn);color:#0b0b0b;font-weight:600}
.menu{display:none;margin-left:auto;background:none;border:1px solid #444;color:#fff;border-radius:6px;font-size:20px;padding:2px 10px}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 24px;background:var(--blk);color:#9fb08a;font-size:12.5px;border-top:3px solid var(--grn)}
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1400px;margin:0 auto}
.side{position:sticky;top:64px;align-self:start;height:calc(100vh - 64px);overflow:auto;padding:18px 10px 30px 18px;border-right:1px solid var(--line);font-size:14px}
.side a{display:flex;gap:8px;padding:6px 10px;border-radius:6px;color:#33402a;line-height:1.35}.side a i{font-style:normal;color:var(--grn);font-weight:700;min-width:20px}
.side a:hover{background:var(--light);text-decoration:none}.side a.on{background:var(--light);font-weight:700;box-shadow:inset 3px 0 0 var(--grn)}
.sidehead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);margin:14px 10px 6px}
.doc{padding:28px 44px 60px;min-width:0;max-width:1050px}
.crumb{font-size:13px;color:var(--grey)}
.doc h1{font-size:34px;line-height:1.2;margin:6px 0 14px;color:var(--blk);border-bottom:4px solid var(--grn);padding-bottom:10px}
.doc h2{font-size:24px;margin:38px 0 10px;color:var(--blk)}.doc h3{font-size:18.5px;margin:26px 0 8px;color:#2d5a0c}
.doc h2::before{content:"";display:inline-block;width:10px;height:22px;background:var(--pink);margin-right:10px;vertical-align:-3px;border-radius:2px}
.doc p,.doc li{max-width:78ch}.doc blockquote{margin:14px 0;padding:10px 16px;border-left:5px solid var(--pink);background:#fff4f7;border-radius:0 8px 8px 0}
.doc code{background:#f1f5ea;padding:1px 5px;border-radius:4px;font-size:.92em}.doc pre{background:#101810;color:#d8f0b8;padding:14px 16px;border-radius:10px;overflow:auto;font-size:13.5px;line-height:1.45}.doc pre code{background:none;padding:0;color:inherit}
.tablewrap{overflow:auto;margin:14px 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}th{background:var(--blk);color:#fff;text-align:left;padding:8px 10px;position:sticky;top:0;font-weight:600;white-space:nowrap}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}tbody tr:nth-child(even){background:#f7faf2}tbody tr:hover{background:var(--light)}
table.dt th{cursor:pointer}table.dt th:hover{background:#222}table.dt th.asc::after{content:" ▲";color:var(--grn2)}table.dt th.desc::after{content:" ▼";color:var(--grn2)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.m-Must{background:#ffe0e8;color:#a3123c}.m-Should{background:#fff1cc;color:#7a5600}.m-Could{background:#e3effa;color:#245a8a}
.s-Draft{background:#eee;color:#555}.s-In-review{background:#fff1cc;color:#7a5600}.s-Approved{background:#e0f3cc;color:#2d5a0c}.s-Retired{background:#e8e8e8;color:#777}
.r-hi{background:#ffd5de;color:#a3123c}.r-md{background:#fff1cc;color:#7a5600}.r-lo{background:#e0f3cc;color:#2d5a0c}
figure{margin:20px 0;text-align:center}figure img{max-width:100%;border:1px solid var(--line);border-radius:10px;background:#fff}figcaption{font-size:13px;color:var(--grey);margin-top:6px}
.otp{background:var(--light);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:10px 0 18px;font-size:14px}.otp summary{cursor:pointer;font-weight:600}.otp ul{margin:6px 0 4px;padding-left:20px}
.pnav{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:18px;border-top:1px solid var(--line)}.pn{padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;max-width:48%}.pn.r{text-align:right}.pn:hover{background:var(--light);text-decoration:none}
/* home */
.home{max-width:1150px;margin:0 auto;padding:30px 22px 60px}.hero{display:flex;gap:30px;align-items:center;background:var(--blk);color:#fff;border-radius:18px;padding:28px 34px;border-bottom:6px solid var(--grn)}
.hero img{width:170px;height:170px;border-radius:14px;flex:none}.hero h1{margin:0 0 8px;font-size:38px;line-height:1.15;color:var(--grn2)}.hero .lead{font-size:19px;margin:0 0 10px}.hero .sub{margin:0;color:#c8d6b8;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:26px 0}.card{display:block;border:1px solid var(--line);border-radius:14px;padding:20px;background:#fff;color:var(--ink);transition:.15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(60,100,20,.15);text-decoration:none;border-color:var(--grn)}.card h3{margin:0 0 6px;font-size:22px}.card p{margin:0 0 12px;color:#44503a;font-size:15px}.card span{color:#3f7d10;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}.stats div{background:var(--light);border-radius:12px;padding:12px 8px;text-align:center}.stats b{display:block;font-size:26px;color:#2d5a0c}.stats span{font-size:12px;color:var(--grey)}
.fw h2,.chap h2{margin:34px 0 10px}.badges{display:flex;flex-wrap:wrap;gap:10px}.badges span{background:#fff4f7;border:1px solid #f6c3d0;border-radius:99px;padding:6px 14px;font-size:14px;color:#8a1b3b;font-weight:600}
.chap ol{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:8px 24px}.chap li a{display:flex;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink)}.chap li a:hover{background:var(--light);text-decoration:none}.chap i{font-style:normal;color:var(--grn);font-weight:800;min-width:22px}
/* workbook */
.wbpage .foot{display:none}.wb{padding:0 0 30px}.wbbar{position:sticky;top:58px;z-index:20;background:#f3f8ec;border-bottom:1px solid var(--line);overflow-x:auto}
#tabs{display:flex;gap:2px;padding:8px 14px 0;min-width:max-content}#tabs button{border:1px solid var(--line);border-bottom:none;background:#e7f0da;padding:7px 14px;border-radius:8px 8px 0 0;cursor:pointer;font:inherit;font-size:13.5px;color:#33402a}
#tabs button.on{background:#fff;font-weight:700;color:#000;box-shadow:inset 0 3px 0 var(--grn)}
#sheet{padding:16px 22px}.tool{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.tool input{padding:8px 12px;border:1px solid #b9c9a6;border-radius:8px;font:inherit;min-width:260px}.tool .meta{color:var(--grey);font-size:13px}.tool a{margin-left:auto;font-size:13px}
.wb .tablewrap{max-height:calc(100vh - 230px)}.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}.panel{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}.panel h4{margin:0 0 10px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}.kpis div{background:var(--blk);color:#fff;border-radius:12px;padding:12px;text-align:center;border-bottom:4px solid var(--grn)}.kpis b{display:block;font-size:28px;color:var(--grn2)}.kpis span{font-size:12px;color:#c8d6b8}
.bar{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:5px 0}.bar i{display:block;height:14px;background:linear-gradient(90deg,var(--grn),var(--grn2));border-radius:7px}.bar em{font-style:normal;color:var(--grey);text-align:right}
.heat{display:grid;grid-template-columns:28px repeat(5,1fr);gap:4px;font-size:11px}.heat div{min-height:46px;border-radius:6px;padding:3px;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start}.heat .ax{background:none;color:var(--grey);align-items:center;justify-content:center;min-height:0}
.heat b{background:#fff;border:1px solid rgba(0,0,0,.2);border-radius:4px;padding:0 4px;font-weight:600}
/* deck */
.deckpage{background:#1a1f16}.deckpage .foot{display:none}.deck{height:calc(100vh - 58px);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:12px 12px 56px}
#stage{position:relative;width:min(100%,calc((100vh - 140px)*16/9));aspect-ratio:16/9;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 10px 40px #000a}
.slide{position:absolute;inset:0;display:none;container-type:inline-size;background:#fff}.slide.on{display:block}
.sl{height:100%;padding:3.2cqw 4cqw;font-size:1.55cqw;line-height:1.4;display:flex;flex-direction:column}
.sl h2{font-size:3cqw;margin:0 0 1.2cqw;line-height:1.15;color:var(--blk);border-bottom:.35cqw solid var(--grn);padding-bottom:.7cqw}.sl .k{font-size:1.1cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);font-weight:700;margin-bottom:.3cqw}
.sl p{margin:.4cqw 0}.sl ul{margin:.4cqw 0;padding-left:2cqw}.sl li{margin:.35cqw 0}.sl table{font-size:1.3cqw}.sl th{padding:.45cqw .7cqw;position:static}.sl td{padding:.4cqw .7cqw}.sl .tablewrap{margin:.6cqw 0;overflow:hidden}
.sl img{max-width:100%;max-height:100%;object-fit:contain;display:block;margin:auto}.sl .fig{flex:1;min-height:0;display:flex}.sl .cols{display:grid;gap:2cqw;flex:1;min-height:0}.sl .box{border:1px solid var(--line);border-radius:1cqw;padding:1.2cqw;background:#f7faf2}.sl .box h4{margin:0 0 .5cqw;font-size:1.5cqw;color:#2d5a0c}
.sl .grid{display:grid;gap:1cqw}.sl .chip{background:var(--light);border:1px solid var(--line);border-radius:.8cqw;padding:.6cqw .9cqw;font-size:1.2cqw}.sl .chip b{display:block;font-size:1.25cqw;color:#2d5a0c}
.sl .big{font-size:2.6cqw;line-height:1.25;font-weight:700}.sl .pillar{background:var(--blk);color:#fff;border-radius:1cqw;padding:1.2cqw}.sl .pillar b{color:var(--grn2)}
.slide.title .sl{background:var(--blk);color:#fff;justify-content:center;border-bottom:1cqw solid var(--grn)}.slide.title h1{font-size:5cqw;line-height:1.1;margin:0 0 1cqw;color:var(--grn2)}.slide.title img{width:15cqw;height:15cqw;margin:0 0 2cqw;border-radius:1.2cqw}.slide.title p{font-size:2cqw;color:#dbe7cb}.slide.title .k{color:var(--pink)}
.slide.dark .sl{background:var(--blk);color:#fff}.slide.dark h2{color:var(--grn2);border-color:var(--pink)}
.dbar{position:absolute;bottom:10px;display:flex;gap:10px;align-items:center;color:#cfe0bb;font-size:14px}.dbar button{background:#2a3322;color:#fff;border:1px solid #4a5a3c;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:15px}.dbar button:hover{background:var(--grn);color:#000}
#prog{position:absolute;left:0;bottom:0;height:4px;background:var(--grn);width:0;transition:width .2s}
#stage.ov{width:100%;aspect-ratio:auto;background:none;box-shadow:none;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;max-height:calc(100vh - 140px);align-content:start}
#stage.ov .slide{position:relative;display:block;aspect-ratio:16/9;border-radius:8px;overflow:hidden;cursor:pointer;outline:3px solid transparent}#stage.ov .slide.on{outline-color:var(--grn)}
@media print{body{background:#fff}.top,.dbar,#prog,.foot,.side,.crumb,.pnav,.otp,.menu{display:none!important}.wrap{display:block}.doc{padding:0;max-width:none}
.deck{display:block;height:auto;padding:0}#stage{width:100%;aspect-ratio:auto;box-shadow:none;overflow:visible}.slide{position:relative;display:block;aspect-ratio:16/9;page-break-after:always;break-inside:avoid}}
@media(max-width:900px){.wrap{display:block}.side{position:fixed;left:0;top:58px;bottom:0;width:280px;background:#fff;z-index:40;transform:translateX(-100%);transition:.2s;height:auto;box-shadow:4px 0 20px #0003}
.navopen .side{transform:none}.menu{display:block}.top nav{display:none}.doc{padding:20px 16px 50px}.cards{grid-template-columns:1fr}.stats{grid-template-columns:repeat(4,1fr)}.hero{flex-direction:column;text-align:center;padding:22px}.chap ol{grid-template-columns:1fr}.doc h1{font-size:27px}}

.pill.x-P{background:#0b0b0b;color:#92d337}.pill.x-S{background:#e6f3d3;color:#2f5d0b}
.streams{max-width:1100px;margin:2rem auto;padding:0 1rem}.streams h2{margin:0 0 .8rem}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem}
.sgrid a{display:flex;align-items:center;gap:.55rem;padding:.7rem .8rem;border:1px solid #d9e6c6;border-radius:10px;background:#fff;color:#0b0b0b;text-decoration:none;font-weight:600}
.sgrid a:hover{border-color:#78b62e;background:#f4faea}.sgrid i{font-style:normal;background:#0b0b0b;color:#92d337;border-radius:50%;width:1.7rem;height:1.7rem;display:grid;place-items:center;font-size:.8rem}

.ctx{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;background:#f4f8ee;border-left:3px solid #78b62e;padding:8px 12px;margin:10px 0 14px;border-radius:4px}.ctx b{color:#0b0b0b;margin-right:4px}

.notes{margin:34px 0 8px;border-top:2px solid #78b62e;padding-top:6px}.notes h4{margin:0 0 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6b6b6b}.nl{height:30px;border-bottom:1px solid #c9ccc6}.side a{white-space:normal;line-height:1.3}@media print{.notes{break-inside:avoid;display:block!important}}

.hbbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:#0b0b0b;color:#fff;padding:10px 14px;border-radius:8px;margin-bottom:18px;font-size:13px}.hbbar .btn{background:#78b62e;color:#0b0b0b;border:0;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer;text-decoration:none}.hb table td,.hb table th{vertical-align:top}.hb th:empty{display:none}@media print{.hbbar{display:none}}

", "Business Strategy Mapping", "How strategy, goals, objectives and courses of action are mapped and tied to the rest of the architecture. Covers principles (a strategy belongs to a community of interest; it responds to the external environment), benefits (alignment, fidelity of objectives, early gap detection) and frameworks: Ansoff grid, SWOT, Five Forces, Kaplan-Norton strategy map, Business Motivation Model, Hoshin Kanri.", "Objectives and vision; strategy to capability trace in requirements.", "Ch 6, 14", "Enterprise", "Business", "Covered"], ["Part 2", "2.2", "Capability Mapping", "Defining, building and using a capability map: capabilities named as nouns, kept stable, grouped by domain, and cross-mapped to value streams, organisation, information and initiatives.", "Capabilities register and capability map.", "Ch 10", "Business", "Enterprise, Domain", "Covered"], ["Part 2", "2.3", "Organization Mapping", "Mapping organisational structure into the architecture, business units to capabilities, plus internal and external parties, so ownership and accountability are visible.", "Stakeholders and RACI registers.", "Ch 7, 16", "Business", "Enterprise", "Covered"], ["Part 2", "2.4", "Value Mapping", "Value streams and value stream stages: how a stakeholder gets value end to end, and which capabilities enable each stage. Often delivered before the capability map because it is faster.", "Value stream register and flow diagram.", "Ch 10", "Business", "Domain", "Covered"], ["Part 2", "2.5", "Information Mapping", "A business view of information: concepts and their relationships, independent of systems, linked to capabilities and value stream stages.", "Data entities, dictionary, conceptual model.", "Ch 11", "Data", "Business", "Covered"], ["Part 2", "2.6", "Initiative Mapping", "Showing initiatives against the capabilities, value streams and objectives they affect, so scope and overlap are visible.", "Work packages and gap analysis.", "Ch 14, 15", "Enterprise", "Business", "Covered"], ["Part 2", "2.7", "Product Mapping", "Products and entitlements, cross-mapped to the capabilities that enable them and to value streams.", "Business services appear in the capability and value-stream registers; add a products register for product-led organisations.", "Ch 10, 18", "Business", "Industry", "Partly covered"], ["Part 2", "2.8", "Stakeholder Mapping", "Formal mapping of customers, partners and internal parties to business units, value streams and information.", "Stakeholders register with power, interest and engagement.", "Ch 7", "Business", "Enterprise", "Covered"], ["Part 2", "2.9", "Policy Mapping", "Organising business policies and aligning them to capabilities and rules; most valuable in regulated sectors and government.", "Business rules, principles and regulatory obligations.", "Ch 6, 8, 10", "Industry", "Business, Domain, Security", "Covered"], ["Part 3", "3", "Business Architecture Practice Guide", "Practice-level guidance: getting started, governance, links to business models, process management, case management, Lean Six Sigma, metrics, requirements, maturity, the architect's role, strategy execution, operating models and customer experience.", "Chapters 5, 7, 16 and 18.", "Ch 5, 7, 16, 18", "Enterprise", "Business", "Covered"], ["Part 3", "3.1", "Common Approaches for Getting Started", "How to begin, with a typical timeline from business planning to deployment; choose a starting scenario and scope first.", "Chapter 18 start in four steps; vision chapter.", "Ch 18", "Enterprise", "Business", "Covered"], ["Part 3", "3.2", "Business Architecture Governance", "Team alignment, role definition and collaborative governance across the business.", "Governance chapter, gates G0 to G9, RACI.", "Ch 16", "Enterprise", "Security", "Covered"], ["Part 3", "3.3", "BA and Business Models", "Using the architecture to interpret a business model (how value is created, delivered and captured) into actionable work.", "Business model in vision; value  for(var i=1;i<=5;i++)H+="<div class=ax>I"+i+"</div>";
 for(var l=5;l>=1;l--){H+="<div class=ax>L"+l+"</div>";for(var im=1;im<=5;im++){var s=l*im,c=s>=15?"#ffd5de":s>=8?"#fff1cc":"#e0f3cc";
  var ids=t.rows.filter(function(r){return +r[L]===l&&+r[I]===im}).map(function(r){return "<b>"+esc(r[0])+"</b>"}).join("");H+='<div style="background:'+c+'">'+ids+"</div>"}}return H+"</div>"}
function dash(){var req=WB.requirements.rows,must=req.filter(function(r){return r[4]==="Must"}).length;
 var k=[[WB.streams.rows.length,"architecture streams"],[WB.togaf_concepts.rows.length+WB.togaf_intro.rows.filter(function(r){return r[0].split(".").length===2}).length,"TOGAF items covered"],[req.length,"requirements"],[must,"must-haves"],[WB.components.rows.length,"components"],[WB.data_entities.rows.length,"data entities"],[WB.dq_rules.rows.length,"quality rules"],[WB.interfaces.rows.length,"interfaces"],[WB.risks.rows.length,"risks"]];
 return '<div class=kpis>'+k.map(function(x){return '<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join("")+'</div><div class=dash>'+
 '<div class=panel><h4>TOGAF items touched per stream (primary + supporting)</h4>'+bars(WB.stream_counts.rows.map(function(r){return[r[1],+r[4]]}))+'</div>'+
 '<div class=panel><h4>Requirements by type</h4>'+bars(countBy("requirements","BABOK class"))+'</div>'+
 '<div class=panel><h4>Requirements by priority (MoSCoW)</h4>'+bars(countBy("requirements","MoSCoW"))+'</div>'+
 '<div class=panel><h4>Requirements by TOGAF ADM phase</h4>'+bars(countBy("requirements","TOGAF ADM phase"))+'</div>'+
 '<div class=panel><h4>Risk heat map (likelihood × impact)</h4>'+heat()+'</div>'+
 '<div class=panel><h4>Data quality rules by dimension</h4>'+bars(countBy("dq_rules","Dimension"))+'</div>'+
 '<div class=panel><h4>Components by layer</h4>'+bars(countBy("components","Layer"))+'</div>'+
 '<div class=panel><h4>Data entities by classification</h4>'+bars(countBy("data_entities","Classification"))+'</div>'+
 '<div class=panel><h4>Work packages by transition architecture</h4>'+bars(countBy("work_packages","Transition architecture"))+'</div></div>'}
function show(n){location.hash=n.replace(/_/g,"-");[].forEach.call(tabs.children,function(b){b.classList.toggle("on",b.dataset.n===n)});
 if(n==="dashboard"){sheet.innerHTML=dash();return}
 var t=WB[n],cols=t.cols,rows=t.rows.slice(),sort=-1,asc=true,q="";
 sheet.innerHTML='<div class=tool><input id=q placeholder="Search '+esc(t.title)+'…" aria-label="Search"><span class=meta id=meta></span><a target=_blank rel=noopener href="https://github.com/'+REPO+'/edit/main/data/'+n+'.csv">Edit this table online ↗</a></div><div class=tablewrap><table class=dt><thead></thead><tbody></tbody></table></div>';
 var th=sheet.querySelector("thead"),tb=sheet.querySelector("tbody"),meta=document.getElementById("meta");
 function draw(){var r=rows.filter(function(x){return !q||x.join(" ").toLowerCase().indexOf(q)>-1});
  if(sort>-1)r.sort(function(a,b){var x=a[sort],y=b[sort],c=(/^[\d.]+$/.test(x)&&/^[\d.]+$/.test(y))?x-y:x.localeCompare(y,undefined,{numeric:true});return asc?c:-c});
  th.innerHTML="<tr>"+cols.map(function(c,i){return '<th data-i='+i+' class="'+(sort===i?(asc?"asc":"desc"):"")+'">'+esc(c)+"</th>"}).join("")+"</tr>";
  tb.innerHTML=r.map(function(x){return "<tr>"+x.map(function(v,i){return "<td>"+pill(cols[i],v)+"</td>"}).join("")+"</tr>"}).join("");
  meta.textContent=r.length+" of "+rows.length+" rows · "+cols.length+" columns";
  th.querySelectorAll("th").forEach(function(h){h.onclick=function(){var i=+h.dataset.i;asc=(sort===i)?!asc:true;sort=i;draw()}})}
 document.getElementById("q").oninput=function(){q=this.value.toLowerCase();draw()};draw()}
names.forEach(function(n){var b=document.createElement("button");b.textContent=n==="dashboard"?"▣ Dashboard":WB[n].title;b.dataset.n=n;b.onclick=function(){show(n)};tabs.appendChild(b)});
var h=location.hash.slice(1).replace(/-/g,"_");show(names.indexOf(h)>-1?h:"dashboard");
})();
</script>

<script>document.querySelectorAll("table.dt").forEach(function(t){
  var ths=t.querySelectorAll("th");
  ths.forEach(function(th,i){th.title="Click to sort";th.addEventListener("click",function(){
    var asc=!th.classList.contains("asc");ths.forEach(function(x){x.classList.remove("asc","desc")});th.classList.add(asc?"asc":"desc");
    var tb=t.tBodies[0],rows=[].slice.call(tb.rows);
    rows.sort(function(a,b){var x=a.cells[i].innerText.trim(),y=b.cells[i].innerText.trim(),nx=parseFloat(x),ny=parseFloat(y);
      var c=(!isNaN(nx)&&!isNaN(ny)&&/^[\d.]+$/.test(x)&&/^[\d.]+$/.test(y))?nx-ny:x.localeCompare(y,undefined,{numeric:true});return asc?c:-c});
    rows.forEach(function(r){tb.appendChild(r)})})});});
document.querySelectorAll(".side a,.top nav a").forEach(function(a){a.addEventListener("click",function(){document.body.classList.remove("navopen")})});
</script></body></html>
